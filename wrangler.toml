name = "disenatujubilacion"
compatibility_date = "2026-09-02"
pages_build_output_dir = "site"

# KV para el límite de envíos por IP en functions/api/submit.js.
# Crea el namespace una vez (ver README.md § Etapa 4) y pega su id acá.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "589b85cf5b264064901d4b473a4e1af0"

# Variables de texto plano (no secretas). Con wrangler.toml presente en el
# proyecto, Cloudflare Pages IGNORA las variables de texto plano puestas en
# el dashboard — solo respeta ahí las marcadas como "Secret". Por eso estas
# van acá, comiteadas, y las secretas de verdad (SHARED_TOKEN,
# BREVO_API_KEY) van SOLO en el dashboard como Secret, nunca en este archivo.
# Ver README.md § El Worker y brevo/README.md § 5.
[vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9WOisFjHNuGWuEkcqgUBm4PHdOMLbowWQesEDXJaD0LBmuV3lFDs83ZvIwVW_pzS8cg/exec"

# Brevo (Etapa 5). BREVO_API_KEY va SOLO en el dashboard como Secret —
# nunca acá. Ver brevo/README.md.
BREVO_SENDER_EMAIL = "hola@disenatujubilacion.com"
BREVO_SENDER_NAME = "Diseña tu Jubilación"
BREVO_TEMPLATE_DOMINO = "1"
BREVO_TEMPLATE_ENTUSIASMO = "2"
BREVO_TEMPLATE_HABLAR = "3"
BREVO_TEMPLATE_PLAN = "4"
# ⚠️ Todavía apuntan a *.pages.dev porque disenatujubilacion.com aún no
# está conectado (Brevo necesita poder descargar el archivo de verdad al
# enviar). Cuando conectes el dominio, cambia las tres al dominio real.
PDF_URL_PLAN = "https://disenatujubilacion.pages.dev/assets/pdfs/plan-468b5d9455ce73904853.pdf"
PDF_URL_HABLAR = "https://disenatujubilacion.pages.dev/assets/pdfs/hablar-bf1229460d8da5438ed2.pdf"
PDF_URL_ENTUSIASMO = "https://disenatujubilacion.pages.dev/assets/pdfs/entusiasmo-9cad1ef7759af90e6233.pdf"
